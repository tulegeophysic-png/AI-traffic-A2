<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Giám Sát Giao Thông AI (YOLOv10 - All-in-One)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --panel-bg: #111b38;
            --border-color: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            max-width: 1300px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        h1 { font-size: 16px; margin: 0; color: var(--text-color); font-weight: bold; }
        .main-layout { display: flex; width: 100%; max-width: 1300px; gap: 12px; }
        .left-column { flex: 1.7; display: flex; flex-direction: column; gap: 10px; }
        .right-column { flex: 1.3; display: flex; flex-direction: column; gap: 10px; }
        .panel { background-color: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; }
        .video-container { position: relative; width: 100%; background: #000; border-radius: 4px; overflow: hidden; display: flex; justify-content: center; align-items: center; max-height: 480px; }
        canvas { width: 100%; height: auto; display: block; }
        video { display: none; }
        .controls-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
        .btn { padding: 5px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; color: #fff; }
        .btn-primary { background-color: #2563eb; }
        .btn-danger { background-color: #dc2626; }
        .btn-success { background-color: #16a34a; }
        .btn-info { background-color: #0284c7; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .status-pill { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
        .status-pill.ready { background: #16a34a; color: #fff; }
        .status-pill.loading { background: #d97706; color: #fff; }
        .status-pill.stopped { background: #475569; color: #fff; }
        .stat-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
        .stat-table th, .stat-table td { border: 1px solid #1e293b; padding: 5px; text-align: center; }
        .stat-table th { background-color: #0b132b; color: var(--accent-color); }
        .density-badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .density-low { background: #16a34a; color: white; }
        .density-med { background: #d97706; color: white; }
        .density-high { background: #dc2626; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🚗 Hệ Thống Giám Sát & Đếm Phương Tiện Giao Thông AI (YOLOv10 - All in One)</h1>
        <div style="display: flex; gap: 10px; align-items: center; font-size: 11px;">
            <span>Trạng thái: <span id="system-status" class="status-pill loading">ĐANG TẢI MODEL...</span></span>
            <span>FPS: <b id="fps-display" style="color: var(--accent-color);">0.0</b></span>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="panel">
                <div class="controls-row" style="margin-top: 0; margin-bottom: 8px; justify-content: space-between;">
                    <input type="file" id="upload-video" accept="video/*" style="font-size: 11px;">
                    <button id="btn-export-excel" class="btn btn-success">📊 Xuất Excel</button>
                </div>

                <div class="video-container">
                    <canvas id="canvas"></canvas>
                    <video id="video-source" muted playsinline></video>
                </div>

                <div class="controls-row" style="justify-content: space-between;">
                    <div style="display: flex; gap: 6px;">
                        <button id="btn-start" class="btn btn-primary" disabled>▶ Chạy AI</button>
                        <button id="btn-stop" class="btn btn-danger" disabled>⏸ Dừng lại</button>
                        <button id="btn-reset" class="btn btn-danger">🔄 Reset Thống Kê</button>
                    </div>
                    <button id="btn-capture" class="btn btn-info" disabled>📷 Chụp Khung Hình</button>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="panel">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--accent-color);">📊 Bảng Thống Kê (Đếm Trực Tiếp)</div>
                <div style="font-size: 11px; margin-bottom: 6px;">
                    Mật độ: <span id="density-status" class="density-badge density-low">LOW</span>
                </div>

                <table class="stat-table">
                    <thead>
                        <tr>
                            <th>Loại xe</th>
                            <th>Trái</th>
                            <th>Phải</th>
                            <th>Tổng</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>🚗 Car</td><td id="count-car-left">0</td><td id="count-car-right">0</td><td id="count-car">0</td></tr>
                        <tr><td>🏍️ Motorcycle</td><td id="count-moto-left">0</td><td id="count-moto-right">0</td><td id="count-moto">0</td></tr>
                        <tr><td>🚌 Bus</td><td id="count-bus-left">0</td><td id="count-bus-right">0</td><td id="count-bus">0</td></tr>
                        <tr><td>🚚 Truck</td><td id="count-truck-left">0</td><td id="count-truck-right">0</td><td id="count-truck">0</td></tr>
                        <tr style="font-weight: bold; background: #0b132b;">
                            <td>TỔNG CỘNG</td>
                            <td id="count-left-total" style="color: var(--accent-color);">0</td>
                            <td id="count-right-total" style="color: var(--accent-color);">0</td>
                            <td id="count-total" style="color: var(--accent-color);">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="panel" style="flex-grow: 1;">
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 4px; color: var(--accent-color);">📈 Biểu Đồ Thống Kê</div>
                <div style="position: relative; height: 180px;">
                    <canvas id="trafficChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- TOÀN BỘ LOGIC HỆ THỐNG GỘP TRONG 1 FILE ---
        let session = null;
        let canvas, ctx, inferenceCanvas, inferenceCtx;
        let videoElement;
        let isRunning = false;
        let isInferencing = false;
        let latestDetections = [];

        const CLASSES = ['person', 'bicycle', 'car', 'motorcycle', 'airplane', 'bus', 'train', 'truck'];
        
        const vehicleStats = {
            car: { left: 0, right: 0, total: 0 },
            motorcycle: { left: 0, right: 0, total: 0 },
            bus: { left: 0, right: 0, total: 0 },
            truck: { left: 0, right: 0, total: 0 }
        };

        let trackedObjects = {};
        let nextObjectID = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            inferenceCanvas = document.createElement('canvas');
            inferenceCtx = inferenceCanvas.getContext('2d');
            videoElement = document.getElementById('video-source');

            initChart();
            setupEvents();

            // Tải mô hình ONNX
            try {
                ort.env.wasm.numThreads = 1;
                ort.env.wasm.simd = false;
                session = await ort.InferenceSession.create('./yolov10n.onnx', { executionProviders: ['wasm'] });
                setSystemStatus('ready', 'AI SẴN SÀNG');
                if (videoElement.src) document.getElementById('btn-start').disabled = false;
            } catch (err) {
                console.error(err);
                setSystemStatus('stopped', 'LỖI TẢI MODEL AI');
            }
        });

        function setSystemStatus(type, text) {
            const el = document.getElementById('system-status');
            el.className = `status-pill ${type}`;
            el.innerText = text;
        }

        function setupEvents() {
            document.getElementById('upload-video').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (isRunning) stopAI();
                    videoElement.src = URL.createObjectURL(file);
                    videoElement.load();
                    videoElement.onloadedmetadata = () => {
                        canvas.width = videoElement.videoWidth;
                        canvas.height = videoElement.videoHeight;
                        inferenceCanvas.width = canvas.width;
                        inferenceCanvas.height = canvas.height;
                        ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                        if (session) document.getElementById('btn-start').disabled = false;
                    };
                }
            });

            document.getElementById('btn-start').addEventListener('click', startAI);
            document.getElementById('btn-stop').addEventListener('click', stopAI);
            document.getElementById('btn-reset').addEventListener('click', resetSystem);
            document.getElementById('btn-export-excel').addEventListener('click', exportExcel);
        }

        function startAI() {
            if (!videoElement.src || !session) return;
            videoElement.play();
            isRunning = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            setSystemStatus('ready', 'ĐANG CHẠY AI');
            requestAnimationFrame(processFrame);
        }

        function stopAI() {
            isRunning = false;
            videoElement.pause();
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            setSystemStatus('stopped', 'ĐÃ DỪNG AI');
        }

        function resetSystem() {
            stopAI();
            for (let k in vehicleStats) {
                vehicleStats[k].left = 0;
                vehicleStats[k].right = 0;
                vehicleStats[k].total = 0;
            }
            trackedObjects = {};
            nextObjectID = 1;
            latestDetections = [];
            updateUI();
        }

        let lastTime = performance.now();
        let frameCount = 0;

        function processFrame() {
            if (!isRunning) return;
            if (videoElement.paused || videoElement.ended) {
                stopAI();
                return;
            }

            const now = performance.now();
            frameCount++;
            if (now - lastTime >= 1000) {
                document.getElementById('fps-display').innerText = ((frameCount * 1000) / (now - lastTime)).toFixed(1);
                frameCount = 0;
                lastTime = now;
            }

            // 1. Vẽ video lên canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

            // 2. Vẽ bounding boxes
            latestDetections.forEach(det => {
                let [x1, y1, x2, y2] = det.box;
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                ctx.fillStyle = '#00ffcc';
                ctx.font = '13px Arial';
                ctx.fillText(`${det.className} (${(det.score * 100).toFixed(0)}%)`, x1, Math.max(y1 - 5, 15));
            });

            // 3. Vẽ ID Tracking
            Object.entries(trackedObjects).forEach(([id, obj]) => {
                let [cx, cy] = obj.centroid;
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath();
                ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(`ID: ${id}`, cx + 6, cy + 4);
            });

            // 4. Gọi suy luận ngầm
            if (!isInferencing && session) {
                isInferencing = true;
                inferenceCtx.drawImage(videoElement, 0, 0, inferenceCanvas.width, inferenceCanvas.height);
                setTimeout(async () => {
                    try {
                        const { tensor, ratio, dw, dh } = preprocess(inferenceCanvas, 640);
                        const results = await session.run({ [session.inputNames[0]]: tensor });
                        const output = results[session.outputNames[0]];
                        latestDetections = parseOutput(output, canvas.width, canvas.height, ratio, dw, dh);
                        matchAndCount(latestDetections, canvas.width);
                        updateUI();
                    } catch (err) {
                        console.error(err);
                    } finally {
                        isInferencing = false;
                    }
                }, 0);
            }

            requestAnimationFrame(processFrame);
        }

        function preprocess(cvs, targetSize = 640) {
            const w = cvs.width, h = cvs.height;
            const ratio = Math.min(targetSize / w, targetSize / h);
            const newW = Math.round(w * ratio), newH = Math.round(h * ratio);
            const dw = (targetSize - newW) / 2, dh = (targetSize - newH) / 2;

            const off = document.createElement('canvas');
            off.width = targetSize; off.height = targetSize;
            const oCtx = off.getContext('2d');
            oCtx.fillStyle = '#000';
            oCtx.fillRect(0, 0, targetSize, targetSize);
            oCtx.drawImage(cvs, 0, 0, w, h, dw, dh, newW, newH);

            const imgData = oCtx.getImageData(0, 0, targetSize, targetSize).data;
            const float32Data = new Float32Array(3 * targetSize * targetSize);
            for (let i = 0; i < targetSize * targetSize; i++) {
                float32Data[i] = imgData[i * 4] / 255.0;
                float32Data[targetSize * targetSize + i] = imgData[i * 4 + 1] / 255.0;
                float32Data[2 * targetSize * targetSize + i] = imgData[i * 4 + 2] / 255.0;
            }
            return { tensor: new ort.Tensor('float32', float32Data, [1, 3, targetSize, targetSize]), ratio, dw, dh };
        }

        function parseOutput(output, origW, origH, ratio, dw, dh) {
            if (!output || !output.data) return [];
            let dets = [];
            const data = output.data;
            const numBoxes = output.dims[1] || (data.length / 6);

            for (let i = 0; i < numBoxes; i++) {
                const offset = i * 6;
                let x1 = (data[offset] - dw) / ratio;
                let y1 = (data[offset + 1] - dh) / ratio;
                let x2 = (data[offset + 2] - dw) / ratio;
                let y2 = (data[offset + 3] - dh) / ratio;
                let score = data[offset + 4];
                let classId = Math.round(data[offset + 5]);

                if (score < 0.15) continue;
                let rawName = CLASSES[classId] || 'car';
                let className = ['car', 'motorcycle', 'bus', 'truck'].includes(rawName) ? rawName : 'car';
                if (rawName === 'motorbike') className = 'motorcycle';

                dets.push({ box: [x1, y1, x2, y2], score, className });
            }
            return dets;
        }

        // ĐẾM TRỰC TIẾP KHÔNG CẦN VẠCH
        function matchAndCount(dets, canvasWidth) {
            let current = dets.map(d => ({
                centroid: [(d.box[0] + d.box[2]) / 2, (d.box[1] + d.box[3]) / 2],
                className: d.className
            }));

            if (Object.keys(trackedObjects).length === 0) {
                current.forEach(item => {
                    trackedObjects[nextObjectID] = { centroid: item.centroid, className: item.className, lastSeen: 0 };
                    addCount(item.className, item.centroid[0], canvasWidth);
                    nextObjectID++;
                });
                return;
            }

            let objIDs = Object.keys(trackedObjects);
            current.forEach(item => {
                let minDist = Infinity, matchedID = null;
                objIDs.forEach(id => {
                    let t = trackedObjects[id];
                    if (t.className === item.className) {
                        let dist = Math.hypot(t.centroid[0] - item.centroid[0], t.centroid[1] - item.centroid[1]);
                        if (dist < minDist && dist < 100) {
                            minDist = dist;
                            matchedID = id;
                        }
                    }
                });

                if (matchedID !== null) {
                    trackedObjects[matchedID].centroid = item.centroid;
                    trackedObjects[matchedID].lastSeen = 0;
                } else {
                    trackedObjects[nextObjectID] = { centroid: item.centroid, className: item.className, lastSeen: 0 };
                    addCount(item.className, item.centroid[0], canvasWidth);
                    nextObjectID++;
                }
            });

            Object.keys(trackedObjects).forEach(id => {
                trackedObjects[id].lastSeen++;
                if (trackedObjects[id].lastSeen > 30) delete trackedObjects[id];
            });
        }

        function addCount(type, cx, canvasWidth) {
            if (vehicleStats[type]) {
                if (cx < canvasWidth / 2) vehicleStats[type].left++;
                else vehicleStats[type].right++;
                vehicleStats[type].total++;
            }
        }

        function updateUI() {
            ['car', 'motorcycle', 'bus', 'truck'].forEach(type => {
                document.getElementById(`count-${type}-left`).innerText = vehicleStats[type].left;
                document.getElementById(`count-${type}-right`).innerText = vehicleStats[type].right;
                document.getElementById(`count-${type}`).innerText = vehicleStats[type].total;
            });

            let tLeft = 0, tRight = 0, tTotal = 0;
            for (let k in vehicleStats) {
                tLeft += vehicleStats[k].left;
                tRight += vehicleStats[k].right;
                tTotal += vehicleStats[k].total;
            }
            document.getElementById('count-left-total').innerText = tLeft;
            document.getElementById('count-right-total').innerText = tRight;
            document.getElementById('count-total').innerText = tTotal;

            const badge = document.getElementById('density-status');
            if (tTotal >= 40) { badge.className = 'density-badge density-high'; badge.innerText = 'HIGH'; }
            else if (tTotal >= 15) { badge.className = 'density-badge density-med'; badge.innerText = 'MEDIUM'; }
            else { badge.className = 'density-badge density-low'; badge.innerText = 'LOW'; }
        }

        let trafficChart;
        function initChart() {
            const ctxChart = document.getElementById('trafficChart').getContext('2d');
            trafficChart = new Chart(ctxChart, {
                type: 'bar',
                data: {
                    labels: ['Car', 'Moto', 'Bus', 'Truck'],
                    datasets: [{ label: 'Số lượng', data: [0,0,0,0], backgroundColor: ['#38bdf8', '#16a34a', '#d97706', '#dc2626'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
            setInterval(() => {
                if(trafficChart) {
                    trafficChart.data.datasets[0].data = [
                        vehicleStats.car.total,
                        vehicleStats.motorcycle.total,
                        vehicleStats.bus.total,
                        vehicleStats.truck.total
                    ];
                    trafficChart.update();
                }
            }, 1000);
        }

        function exportExcel() {
            let csv = "\uFEFFLoại xe,Làn Trái,Làn Phải,Tổng\n";
            for (let k in vehicleStats) {
                csv += `${k.toUpperCase()},${vehicleStats[k].left},${vehicleStats[k].right},${vehicleStats[k].total}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `traffic_${Date.now()}.csv`;
            link.click();
        }
    </script>
</body>
</html>
